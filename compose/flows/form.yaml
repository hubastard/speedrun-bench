appId: dev.speedrun.composebench
name: Form
---
# Material 3 text fields (speedrun issue #8): a tap on the second moves the focus there, and
# what is typed next goes to it; the third is tapped by the id on a column around it.
- launchApp
- tapOn: Form
- tapOn:
    id: email
- inputText: ada@example.com
- tapOn:
    id: password
- assertVisible:
    id: password
    focused: true
- inputText: s3cret
- tapOn:
    id: code
- inputText: '2468'
- tapOn: Sign in
- assertVisible: "Signed in as ada@example.com / s3cret / 2468"
# A field whose app changes what is typed (upper case) restarts the keyboard's input on each
# key: every character still goes in, in order.
- tapOn:
    id: handle
- inputText: speedrun runs fast
- assertVisible: SPEEDRUN RUNS FAST
- assertVisible: "18 / 64"
- hideKeyboard
- tapOn: Close form
- assertVisible: Compose Bench
