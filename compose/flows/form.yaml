appId: dev.speedrun.composebench
name: Form
---
# Material 3 text fields (speedrun issue #8): a tap on the second moves the focus there, and
# what is typed next goes to it; the third is tapped by the id on a column around it.
- launchApp
- tapOn: Form
- tapOn:
    id: email
- inputText: ada@example.com
- tapOn:
    id: password
- assertVisible:
    id: password
    focused: true
- inputText: s3cret
- tapOn:
    id: code
- inputText: '2468'
- tapOn: Sign in
- assertVisible: "Signed in as ada@example.com / s3cret / 2468"
# A field whose app changes what is typed (upper case) restarts the keyboard's input on each
# key: every character still goes in, in order.
- tapOn:
    id: handle
- inputText: speedrun runs fast
- assertVisible: SPEEDRUN RUNS FAST
- assertVisible: "18 / 64"
- hideKeyboard
# eraseText erases all of a field that holds no more than it erases, wherever the tap put the
# cursor: a tap at this field's center lands inside its text. Speedrun 0.4.13 (and Maestro)
# erased only what was before the cursor, and the text typed next went in front of the rest
# ("FASTS FAST").
- tapOn:
    id: handle
- eraseText: 40
- inputText: fast
- assertVisible:
    id: handle
    text: FAST
- assertVisible: "4 / 64"
- hideKeyboard
# A dialog whose field takes the focus as it opens, and whose buttons the keyboard then covers:
# a tap on Cancel hides the keyboard first. Speedrun 0.4.13 (and Maestro) tapped the keyboard
# there, and the dialog stayed.
- tapOn: Clear
- assertVisible: Clear the form?
- tapOn:
    id: clear-cancel
- assertVisible: "Clear: cancelled"
- tapOn: Close form
- assertVisible: Compose Bench
