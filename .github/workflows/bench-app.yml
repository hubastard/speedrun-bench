# Publishes Speedrun Bench (app/) prebuilt, for an Android emulator and an iOS simulator, when
# its sources change on main: assets of this repository's bench-app pre-release, named after
# the sources' hash (bench.sh hash), which `bench.sh install` and Speedrun's Journey workflow
# fetch instead of building the app. Sources already published are skipped.
name: Bench app

on:
  push:
    branches: [main]
    paths:
      - app/app.json
      - app/App.tsx
      - app/index.ts
      - app/tsconfig.json
      - app/package.json
      - app/package-lock.json
      - app/assets/**
      - app/modules/**
      - app/plugins/**
      - app/src/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build and publish
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./bench.sh publish android

  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build and publish
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./bench.sh publish ios
